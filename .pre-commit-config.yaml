# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  # ── Ruff — linting + formatting (replaces black, isort, flake8) ──────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        name: ruff-lint
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi, jupyter]
        exclude: ^notebooks/
      - id: ruff-format
        name: ruff-format
        types_or: [python, pyi, jupyter]
        exclude: ^notebooks/

  # ── mypy — static type checking ──────────────────────────────────────────
  # Uses `python -m mypy` so the venv Python is used regardless of PATH quirks
  - repo: local
    hooks:
      - id: mypy-type-check
        name: mypy-type-check
        entry: .venv\\Scripts\\python.exe -m mypy
        language: system
        types: [python]
        args: [--config-file=pyproject.toml, "src/"]
        pass_filenames: false

  # ── detect-secrets — block credentials from being committed ──────────────
  # Rule 3: No secrets in code, .env files, or GitHub
  - repo: local
    hooks:
      - id: detect-secrets
        name: detect-secrets
        entry: .venv\\Scripts\\detect-secrets-hook.exe
        language: system
        args: ["--baseline", ".secrets.baseline"]

  # ── Standard pre-commit hooks ───────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=5000]
      - id: check-merge-conflict
      - id: debug-statements
