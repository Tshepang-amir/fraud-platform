name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Lint, Type Check & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format
        run: ruff format --check src tests

      - name: mypy
        run: mypy --config-file=pyproject.toml src/

      - name: Unit tests (coverage ≥ 50%)
        run: pytest tests/unit -q --cov-fail-under=50

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: ci
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t fraud-platform:${{ github.sha }} .
